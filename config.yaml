# Active router: passthrough | rule_based | decision_tree
router: trouter

# Oracle model — quality ceiling, used as primary
primary_model: deepseek/deepseek-v4-flash

# Path to WildClawBench-trained decision tree (created in Phase 2)
policy_path: routing_policy.pkl

# JSONL log path (relative to working directory)
log_path: routing.log.jsonl

escalation:
  max_escalations: 2

models:
  - name: openai/gpt-oss-120b:free
    provider: openrouter
    base_url: https://openrouter.ai/api/v1
    api_key_env: OPENROUTER_API_KEY
    tier: 0
    tier_name: fast
    context_window: 128000
    cost_per_1k: 0.0
    supports_tools: true
    thinking_mode: false
    thinking_default: false
    timeout_s: 60.0

  - name: arcee-ai/trinity-large-thinking
    provider: openrouter
    base_url: https://openrouter.ai/api/v1
    api_key_env: OPENROUTER_API_KEY
    tier: 1
    tier_name: reasoning
    context_window: 256000
    cost_per_1k: 0.00022
    supports_tools: true
    thinking_mode: true
    thinking_default: false
    timeout_s: 120.0

  - name: deepseek/deepseek-v4-flash
    provider: openrouter
    base_url: https://openrouter.ai/api/v1
    api_key_env: OPENROUTER_API_KEY
    tier: 2
    tier_name: oracle
    context_window: 256000
    cost_per_1k: 0.00014
    supports_tools: true
    thinking_mode: false
    thinking_default: false
    timeout_s: 120.0
