# Active router: passthrough | rule_based | decision_tree | trouter | perf_router
router: perf_router

perf_router_cost_weight: 0.3
perf_router_baseline: deepseek/deepseek-v4-pro
perf_router_degradation_threshold: 0.15

# Oracle model — quality ceiling, used as primary
primary_model: deepseek-v4-pro

# Path to WildClawBench-trained decision tree (created in Phase 2)
policy_path: routing_policy.pkl

# JSONL log path (relative to working directory)
log_path: routing.log.jsonl

escalation:
  max_escalations: 2

models:
  - name: openai/gpt-oss-120b:free
    provider: openrouter
    base_url: https://openrouter.ai/api/v1
    api_key_env: OPENROUTER_API_KEY
    tier: 0
    tier_name: fast
    context_window: 128000
    cost_per_1k: 0.0
    supports_tools: true
    thinking_mode: false
    thinking_default: false
    timeout_s: 60.0

  - name: deepseek-v4-flash
    provider: deepseek
    base_url: https://api.deepseek.com
    api_key_env: DEEPSEEK_API_KEY
    tier: 1
