<header class="page-head">
<h1>ModelRouter — optmod + PerfRouter</h1>
<p>Project overview deck: goals, advantages, how optmod and PerfRouter work, where they differ from other routers, and the roadmap. Speaker notes are under each slide. A PDF of the same deck is in <a href="optmod-perfrouter-deck.pdf">optmod-perfrouter-deck.pdf</a>.</p>
</header>
<main>
<figure class="slide-wrap" id="slide-1">
<div class="frame">
<section class="slide" id="cover" data-transition="fade" style="background:#0F1629;color:#F2F4FA;font-family:'IBM Plex Sans', Arial, sans-serif;padding:128px 128px 160px;display:flex;flex-direction:column;justify-content:space-between;gap:48px">
<div style="display:flex;gap:48px;align-items:start">
<div style="flex:1;display:flex;flex-direction:column;gap:28px">
<p style="font-family:'JetBrains Mono', 'Courier New', monospace;font-size:24px;font-weight:500;letter-spacing:3px;text-transform:uppercase;color:#8EA2FF">ModelRouter · project overview</p>
<h1 style="font-size:104px;font-weight:600;line-height:1.05;letter-spacing:-2px;color:#F2F4FA">optmod <span style="color:#F2A33A">+</span><br>PerfRouter</h1>
<p style="font-size:32px;line-height:1.4;color:#C5CCE3">Route every LLM request to the model with the best predicted quality for its cost, with no LLM call to decide.</p>
</div>
<img src="assets/optmod-dashboard.png" alt="The optmod routing dashboard running with the PerfRouter router: request totals, success and escalation rates, per-model traffic share by tier, a latency histogram and the recent requests table." style="width:860px;height:431px;object-fit:cover;border:1px solid #2A3557;border-radius:12px;box-shadow:0px 16px 48px rgba(0,0,0,0.45)">
</div>
<div style="display:flex;gap:32px">
<div style="flex:1;display:flex;flex-direction:column;gap:8px;background:#18213A;border:1px solid #2A3557;border-radius:16px;padding:28px">
<p style="font-family:'JetBrains Mono', 'Courier New', monospace;font-size:24px;font-weight:500;color:#8EA2FF">Goal 1</p>
<h3 style="font-size:32px;font-weight:600;line-height:1.2;color:#F2F4FA">Best model per request</h3>
<p style="font-size:26px;line-height:1.4;color:#C5CCE3">Predict each model's quality on the task and pick the best quality-for-cost, not one flagship for everything.</p>
</div>
<div style="flex:1;display:flex;flex-direction:column;gap:8px;background:#18213A;border:1px solid #2A3557;border-radius:16px;padding:28px">
<p style="font-family:'JetBrains Mono', 'Courier New', monospace;font-size:24px;font-weight:500;color:#8EA2FF">Goal 2</p>
<h3 style="font-size:32px;font-weight:600;line-height:1.2;color:#F2F4FA">No routing overhead</h3>
<p style="font-size:26px;line-height:1.4;color:#C5CCE3">Decide in 2–4 ms with sentence-BERT and XGBoost. No LLM call, no added cost, no extra latency.</p>
</div>
<div style="flex:1;display:flex;flex-direction:column;gap:8px;background:#18213A;border:1px solid #2A3557;border-radius:16px;padding:28px">
<p style="font-family:'JetBrains Mono', 'Courier New', monospace;font-size:24px;font-weight:500;color:#8EA2FF">Goal 3</p>
<h3 style="font-size:32px;font-weight:600;line-height:1.2;color:#F2F4FA">Invisible to the agent</h3>
<p style="font-size:26px;line-height:1.4;color:#C5CCE3">An OpenAI-compatible endpoint. Point any agent at it; routing, escalation and logging happen in one HTTP call.</p>
</div>
</div>
<p style="position:absolute;left:128px;bottom:64px;width:1664px;font-family:'JetBrains Mono', 'Courier New', monospace;font-size:24px;color:#8A94B8">github.com/jiuwencortex/optmod · github.com/jiuwencortex/perfrouter</p>
</section>
</div>
<figcaption><span class="num">01</span> <b>Speaker notes.</b> Two repos, one system. PerfRouter is the library that learns which model is good at which kind of task from benchmark data. optmod is the local OpenAI-compatible proxy (localhost:8765/v1) that uses it on live traffic. The three goals: pick the best quality-for-cost model per request, add no meaningful latency or cost to do so, and stay transparent to the calling agent.</figcaption>
</figure>
<figure class="slide-wrap" id="slide-2">
<div class="frame">
<section class="slide" id="advantages" data-transition="fade" style="background:#F7F8FC;color:#141B2E;font-family:'IBM Plex Sans', Arial, sans-serif;padding:128px 128px 160px;display:flex;flex-direction:column;gap:40px">
<div style="display:flex;flex-direction:column;gap:12px">
<p style="font-family:'JetBrains Mono', 'Courier New', monospace;font-size:24px;font-weight:500;letter-spacing:3px;text-transform:uppercase;color:#4361EE">Advantages</p>
<h2 style="font-size:60px;font-weight:600;line-height:1.1;letter-spacing:-1px;color:#141B2E">What the project delivers</h2>
</div>
<div style="display:grid;grid-template-columns:repeat(3, 1fr);gap:24px">
<div style="display:flex;flex-direction:column;gap:14px;background:#FCFCFF;border:1px solid #DDE1EC;border-radius:16px;padding:32px">
<div style="display:flex;gap:16px;align-items:center">
<svg class="x-icon" viewBox="0 0 24 24" style="color:#4361EE;width:36px;height:36px;flex:none" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/></svg>
<h3 style="font-size:32px;font-weight:600;line-height:1.2;color:#141B2E">No LLM in the loop</h3>
</div>
<p style="font-size:26px;line-height:1.4;color:#4A5370">Task classification takes about 1 ms and a full routing decision 2–4 ms, all local.</p>
</div>
<div style="display:flex;flex-direction:column;gap:14px;background:#FCFCFF;border:1px solid #DDE1EC;border-radius:16px;padding:32px">
<div style="display:flex;gap:16px;align-items:center">
<svg class="x-icon" viewBox="0 0 24 24" style="color:#4361EE;width:36px;height:36px;flex:none" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><ellipse cx="12" cy="5" rx="9" ry="3"/><path d="M3 5v14c0 1.66 4 3 9 3s9-1.34 9-3V5"/><path d="M3 12c0 1.66 4 3 9 3s9-1.34 9-3"/></svg>
<h3 style="font-size:32px;font-weight:600;line-height:1.2;color:#141B2E">Easy model onboarding</h3>
</div>
<p style="font-size:26px;line-height:1.4;color:#4A5370">Models are scored from public Artificial Analysis and Arena data, so adding one needs no WildClawBench run.</p>
</div>
<div style="display:flex;flex-direction:column;gap:14px;background:#FCFCFF;border:1px solid #DDE1EC;border-radius:16px;padding:32px">
<div style="display:flex;gap:16px;align-items:center">
<svg class="x-icon" viewBox="0 0 24 24" style="color:#4361EE;width:36px;height:36px;flex:none" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><line x1="4" y1="21" x2="4" y2="14"/><line x1="4" y1="10" x2="4" y2="3"/><line x1="12" y1="21" x2="12" y2="12"/><line x1="12" y1="8" x2="12" y2="3"/><line x1="20" y1="21" x2="20" y2="16"/><line x1="20" y1="12" x2="20" y2="3"/><line x1="1" y1="14" x2="7" y2="14"/><line x1="9" y1="8" x2="15" y2="8"/><line x1="17" y1="16" x2="23" y2="16"/></svg>
<h3 style="font-size:32px;font-weight:600;line-height:1.2;color:#141B2E">Cost tuned at runtime</h3>
</div>
<p style="font-size:26px;line-height:1.4;color:#4A5370">Price stays out of the trained model. Change the cost weight α or a quality floor without retraining.</p>
</div>
<div style="display:flex;flex-direction:column;gap:14px;background:#FCFCFF;border:1px solid #DDE1EC;border-radius:16px;padding:32px">
<div style="display:flex;gap:16px;align-items:center">
<svg class="x-icon" viewBox="0 0 24 24" style="color:#4361EE;width:36px;height:36px;flex:none" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>
<h3 style="font-size:32px;font-weight:600;line-height:1.2;color:#141B2E">Built-in resilience</h3>
</div>
<p style="font-size:26px;line-height:1.4;color:#4A5370">Failed calls escalate fast → reasoning → oracle, and session pinning keeps multi-turn chats on cached-read pricing.</p>
</div>
<div style="display:flex;flex-direction:column;gap:14px;background:#FCFCFF;border:1px solid #DDE1EC;border-radius:16px;padding:32px">
<div style="display:flex;gap:16px;align-items:center">
<svg class="x-icon" viewBox="0 0 24 24" style="color:#4361EE;width:36px;height:36px;flex:none" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.77-3.77a6 6 0 0 1-7.94 7.94l-6.91 6.91a2.12 2.12 0 0 1-3-3l6.91-6.91a6 6 0 0 1 7.94-7.94l-3.76 3.76z"/></svg>
<h3 style="font-size:32px;font-weight:600;line-height:1.2;color:#141B2E">Interchangeable routers</h3>
</div>
<p style="font-size:26px;line-height:1.4;color:#4A5370">Five routing algorithms swap at runtime with no restart, and the model pool is a config edit.</p>
</div>

<figcaption><span class="num">04</span> <b>Speaker notes.</b> Request time: the 33 task-type definitions are embedded once at startup with all-MiniLM-L6-v2, so classification is a dot product. The top 3 task types form a similarity-weighted ensemble. For each model, XGBoost predicts quality from a masked feature vector: only the active task type&#x27;s affinity column is populated, the rest are NaN, which is what makes a single model task-aware. Cost is normalised across the pool and applied afterwards, so alpha (PERF_ROUTER_COST_WEIGHT) and the degradation threshold change without retraining. Offline: Step 0 discovers models from OpenRouter and Artificial Analysis; steps 1 to 2 fetch AA benchmark data and Arena ELO; steps 3 to 5 patch the taxonomy, build the benchmark weight matrix and compute feature vectors; step 6 runs 10-fold CV stratified by task type, then trains the final model on all data. Similarity under 0.20 falls back to the cheapest eligible model. Step 2 scores the top 3 task types as a similarity-weighted ensemble; step 3&#x27;s eligibility filters are context window, vision capability and the cost cap. Results strip: routing over all 61 WildClawBench tasks with a 10-model pool. The figures come from the routing simulation in the technical summary and were then confirmed with real WildClawBench runs. Both runs use a 25% degradation threshold: any eligible model whose predicted quality is within 25% of the best eligible model qualifies, and the cheapest of those is chosen (alpha plays no part in this mode). Why the saving is larger against the cheaper baseline: the baseline also sets the cost cap, which excludes any model costing more than 2 times the baseline. With V4 Flash as baseline (0.175 dollars per 1M) the cap is 0.35 dollars, so V4 Pro, Mimo, Kimi and Sonnet are out of the pool. The best model left is roughly Flash-level, free and near-free models (GPT-OSS, Nemotron, Hy3) come within 25% of it on about 74% of tasks, and the bill drops from 0.0534 to 0.0106 dollars, 80.1% less. With V4 Pro as baseline (0.544 dollars per 1M) Pro is in the pool and sets a higher quality bar, so fewer cheap models qualify: about 59% of tasks stay on Pro, the rest go to V4 Flash (3 times cheaper) or free models, and the bill drops from 0.1658 to 0.1125 dollars, 32.2% less. So the two percentages are measured at different quality targets and against different base costs; they are not a ranking. In absolute terms the Pro scenario saves more (0.0534 vs 0.0428 dollars). The threshold is the lever: against V4 Pro, savings are 6.6% at 0%, about 10% at 10%, and 32.2% at 25%. Routing is conservative because only 3 of the 10 models (V4 Flash, V4 Pro, GPT-OSS) have WildClawBench ground truth; the rest are estimated from benchmarks.</figcaption>

<figcaption><span class="num">05</span> <b>Speaker notes.</b> Five wedges, each against the alternative it is sharpest against. New models: PerfRouter scores a model from Artificial Analysis and Arena data, so there is no labelled prompt data to collect; RouteLLM learns query difficulty from preference data and has to be kept calibrated as traffic shifts, and Not Diamond is a hosted trained recommender. Model pool: Amazon Bedrock Intelligent Prompt Routing requires exactly two models from the same family and is optimised only for English prompts (AWS documentation). Quality in the gateway: LiteLLM, Portkey and OpenRouter&#x27;s provider routing work from fallbacks, load balancing and price ordering; quality is not a routing input. Token savings: routing saves by choosing a cheaper model, and the mutators save again by shrinking the request. The tool-result compressor applies RTK-style compression to tool outputs (git diff and status, grep, ls and tree, build and test output, log de-duplication, smart truncation), and session pinning keeps a conversation on the model whose prompt cache is warm. The two savings stack. The claim that other routers forward requests unchanged is true by design of the pure routers; check it per gateway before presenting, and add a measured token-saving figure for the compressor if you have one. Where it runs: the decision is local, with no LLM call and no per-request markup. Evidence: the cost savings on the previous slide were confirmed with real WildClawBench runs.</figcaption>
</figure>

<figcaption><span class="num">06</span> <b>Speaker notes.</b> Three phases. Now: finish the optmod and PerfRouter integration so there is one source of model data instead of three copies, with the cost cap wired through; add Laya to the decision chain alongside PerfRouter; and widen the task taxonomy with GAIA for broader task types and difficulty levels, without running GAIA on every model. Next: the feedback loop that retrains routers from routing.log.jsonl, a file-backed session-pin store so pins survive a restart, and a measurement of optmod&#x27;s own overhead and concurrency ceiling, plus exporting the trained model to a portable format. Later: a Rust data plane for the request path (proxy and streaming, mutators, session pinning, routing inference), with the training pipeline and model discovery staying in Python. The case for Rust is throughput under concurrent load, a smaller footprint without PyTorch, and single-binary deployment. It is not a per-request latency win: the model call takes seconds and the routing decision 2 to 4 ms. The bottom strip is the point to stress: routers sit behind one interface (five today, swappable at runtime) and models are configuration, so each roadmap step replaces one part while agents keep calling the same OpenAI-compatible endpoint. That is also what makes the Rust step safe: the trained model files are the contract between the two sides.</figcaption>
